name: CI

on:
  push:
    branches:
      - restored-main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      STUDIO_AUTH: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[studio,dev]"
          # eval/rag (exercised by tests/rag) needs these at import time.
          pip install pyyaml numpy

      - name: Ruff
        run: ruff check veritasgraph studio_api veritasgraph_mcp

      - name: Tests
        run: >
          python -m pytest studio_api/tests tests -q
          -m "not ollama"
          --ignore=studio_api/tests/test_e2e_playwright.py
