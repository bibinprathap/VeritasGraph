# VeritasGraph Studio + Ollama, sharing one SQLite graph store on a named volume.
#
#   STUDIO_API_TOKENS="$(openssl rand -hex 24):admin" docker compose up
#
# Studio: http://127.0.0.1:8200/studio  (published on loopback only)
# The MCP server reads the same store:
#   docker compose run --rm -T mcp      # stdio; VERITASGRAPH_MCP_MODE=read by default
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

  studio:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -q 'fastapi>=0.110' 'uvicorn[standard]>=0.29' 'pydantic>=2.5' 'httpx>=0.27'
      && uvicorn studio_api.main:app --host 0.0.0.0 --port 8200"
    environment:
      OLLAMA_HOST: http://ollama:11434
      STUDIO_DATA_DIR: /data
      STUDIO_API_TOKENS: ${STUDIO_API_TOKENS:?set STUDIO_API_TOKENS="token:role,..." (tokens >= 24 chars)}
      VERITASGRAPH_COMPILE_INTERVAL: ${VERITASGRAPH_COMPILE_INTERVAL:-0}
      VERITASGRAPH_PII_POLICY: ${VERITASGRAPH_PII_POLICY:-tag}
    volumes:
      - ./:/app:ro
      - graph:/data
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      - ollama

  mcp:
    build:
      context: .
      dockerfile: veritasgraph_mcp/Dockerfile
    stdin_open: true
    environment:
      OLLAMA_HOST: http://ollama:11434
      STUDIO_DATA_DIR: /data
      VERITASGRAPH_MCP_MODE: ${VERITASGRAPH_MCP_MODE:-read}
    volumes:
      - graph:/data
    profiles: ["mcp"]
    depends_on:
      - ollama

volumes:
  ollama:
  graph:
