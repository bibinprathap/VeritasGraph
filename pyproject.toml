[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritasgraph-mcp"
version = "0.1.2"
description = "The first zero-trust, air-gapped Enterprise GraphRAG server for the Model Context Protocol (MCP)."
readme = "veritasgraph_mcp/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bibin Prathap" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "graphrag",
    "knowledge-graph",
    "rag",
    "zero-trust",
    "air-gapped",
    "local-llm",
    "ollama",
    "veritasgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/bibinprathap/VeritasGraph"
Repository = "https://github.com/bibinprathap/VeritasGraph"
Documentation = "https://bibinprathap.github.io/VeritasGraph/"
Issues = "https://github.com/bibinprathap/VeritasGraph/issues"

[project.scripts]
veritasgraph-mcp = "veritasgraph_mcp.server:main"

[tool.setuptools]
packages = ["veritasgraph_mcp", "studio_api"]

[tool.setuptools.package-data]
veritasgraph_mcp = ["README.md"]
