[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritasgraph-mcp"
version = "0.2.0"
description = "The first zero-trust, air-gapped Enterprise GraphRAG server for the Model Context Protocol (MCP)."
readme = "veritasgraph_mcp/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bibin Prathap" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "graphrag",
    "knowledge-graph",
    "rag",
    "zero-trust",
    "air-gapped",
    "local-llm",
    "ollama",
    "veritasgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
]
structured = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.2",
    "sqlglot>=25.0",
    "networkx>=3.2",
    "cryptography>=42",
    "pymysql>=1.1",
    "duckdb-engine>=0.13",
    "clickhouse-sqlalchemy>=0.3.2",
    "trino[sqlalchemy]>=0.328",
]
structured-hive = ["pyhive[hive-pure-sasl]>=0.7", "thrift>=0.16"]
structured-saas = ["snowflake-sqlalchemy>=1.6", "databricks-sqlalchemy>=2.0"]
rerank-local = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pip-licenses>=4.4",
]

[project.urls]
Homepage = "https://github.com/bibinprathap/VeritasGraph"
Repository = "https://github.com/bibinprathap/VeritasGraph"
Documentation = "https://bibinprathap.github.io/VeritasGraph/"
Issues = "https://github.com/bibinprathap/VeritasGraph/issues"

[project.scripts]
veritasgraph-mcp = "veritasgraph_mcp.server:main"
veritasgraph = "veritasgraph.cli:main"

[tool.setuptools]
packages = [
    "veritasgraph_mcp",
    "studio_api",
    "studio_api.routes",
    "studio_api.controllers",
    "veritasgraph",
    "veritasgraph.store",
    "veritasgraph.ontology",
    "veritasgraph.llm",
    "veritasgraph.structured",
    "veritasgraph.structured.store",
    "veritasgraph.structured.connectors",
    "veritasgraph.structured.compile",
    "veritasgraph.structured.ask",
    "veritasgraph.structured.migrations",
    "veritasgraph.structured.migrations.versions",
]

[tool.setuptools.package-data]
veritasgraph_mcp = ["README.md"]
"veritasgraph.structured" = ["prompts/*.md"]
"veritasgraph.structured.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: integration tests that require a live Ollama server (deselect with -m 'not ollama')",
    "postgres: tests that need VG_TEST_PG_DSN pointing at a disposable Postgres + pgvector",
    "engines: tests that need the docker test engines (deploy/docker-compose.onprem.yml --profile test-engines)",
]
