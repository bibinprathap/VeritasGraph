[project]
name = "medkg-signal-reference"
version = "0.1.0"
description = "Reference implementation of MedKG-Signal for ICSPIS 2026"
authors = [{name = "VeritasGraph Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    
    # Graph processing
    "networkx>=3.0",
    "igraph>=0.11.0",
    "python-igraph>=0.11.0",
    
    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "graphviz>=0.20.0",
    "pydot>=2.0.0",
    
    # NLP for clinical text
    "transformers>=4.36.0",
    "sentence-transformers>=2.3.0",
    "spacy>=3.7.0",
    
    # Signal processing
    "scipy>=1.11.0",
    "wfdb>=4.1.0",
    "neurokit2>=0.2.7",
    
    # Medical ontologies
    "bioservices>=1.11.0",
    "obonet>=1.0.0",
    
    # Evaluation
    "scikit-learn>=1.3.0",
    "torchmetrics>=1.3.0",
    
    # Utilities
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    
    # Notebook support
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
